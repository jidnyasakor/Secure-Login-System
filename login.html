<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<link rel="stylesheet"
href="{{url_for('static',filename='style.css')}}">
</head>

<body>

<div class="box">

<h2>Login</h2>

<form method="POST">

<input type="text"
name="username"
placeholder="Username"
required>

<input type="password"
name="password"
placeholder="Password"
required>

<button>Login</button>

</form>

<a href="/register">
Create account
</a>

{% with messages=get_flashed_messages() %}
{% if messages %}
{% for msg in messages %}
<p>{{msg}}</p>
{% endfor %}
{% endif %}
{% endwith %}

</div>

</body>
</html>
